[package]
name = "debridmoviemapper"
version = "1.0.7"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
# `io-util` (AsyncWriteExt) is a PRODUCTION dependency: the accept-loop 503 rejecter in main.rs writes
# the response via it. It was previously only enabled transitively by `signal`; declared explicitly so
# a future tokio feature reshuffle can't break the build.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dav-server = { version = "0.11", default-features = false }
futures-util = "0.3"
regex = "1"
tracing = "0.1"
# `env-filter` lets the log level be set at runtime via RUST_LOG (e.g. RUST_LOG=debridmoviemapper=debug);
# without it `fmt::init()` is pinned to INFO. Pulls in `matchers` (tiny); `regex` is already a dependency.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Only the server + HTTP/1 stack is used (see src/main.rs); `body`/`service`/`Request`/`Response`
# are core and need no feature. hyper-util is used for `rt::TokioIo` + `rt::TokioTimer` (the `tokio`
# feature) — the timer is required for hyper's `header_read_timeout` to take effect.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
dotenvy = "0.15"
rand = "0.9"
redb = "3.1"
thiserror = "2"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }

[dev-dependencies]
urlencoding = "2"
# test-util enables tokio's paused-clock harness — genuinely dev-only (the edition-2021 feature
# resolver keeps it out of release builds). io-util is NOT listed here: it's a production dependency
# declared on the main `tokio` entry above, which the loopback-server test helpers reuse.
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "debridmoviemapper"
path = "src/mapper.rs"
