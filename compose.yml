services:
  debridmoviemapper:
    image: ghcr.io/phrontizo/debridmoviemapper:latest
    container_name: debridmoviemapper
    restart: unless-stopped
    ports:
      # The WebDAV endpoint is UNAUTHENTICATED and proxies CDN fetches, so it is published
      # to localhost only — never expose it to the network. rclone reaches it over the
      # internal Docker network (debridmoviemapper:8080) regardless of this mapping, which
      # exists only for host-local access/debugging. PORT (in .env) sets the published HOST
      # port; the container always listens on 8080 (rclone and the healthcheck expect it), so
      # do not set a PORT env var below — changing the in-container port breaks the mount.
      # The Trakt enrolment page (and the future web UI) are served on this SAME port, so they
      # are reachable only from the host for now (e.g. via an SSH tunnel or a reverse proxy you
      # add). SP4 splits the UI onto its own authenticated port so the proxy stays host-local.
      - "127.0.0.1:${PORT:-8080}:8080"
    # The settings reach the container ONLY through this list: compose substitutes each ${VAR:-}
    # from .env (next to this file) or the shell environment, and the app's own .env lookup finds
    # nothing inside the container. A variable you set in .env that isn't listed here is ignored.
    # Every pass-through has an empty default, and the app treats an empty value as unset (its
    # documented default, shown in the comments). JELLYFIN_URL, JELLYFIN_RCLONE_MOUNT_PATH and
    # DB_PATH are fixed for this stack, and PORT only sets the published host port (see above).
    # Compose reads .env when it CREATES the container: after editing it run `docker compose up -d`
    # (which recreates the container); `docker compose restart` keeps the old environment.
    environment:
      # ── Core ──────────────────────────────────────────────────────────────────
      # Pick a debrid provider by setting EXACTLY ONE of these in .env (or the environment).
      # Both are passed through with an empty default so the unset one is treated as absent;
      # the app selects the provider from whichever is non-empty and errors clearly if
      # neither or both are set.
      - RD_API_TOKEN=${RD_API_TOKEN:-}
      - TORBOX_API_KEY=${TORBOX_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:?Set TMDB_API_KEY in .env or environment}
      - DB_PATH=/data/metadata.db
      # Provider poll cadence (seconds; default 60, min 10).
      - SCAN_INTERVAL_SECS=${SCAN_INTERVAL_SECS:-}
      # Size (MB) of the first read-ahead CDN fetch when a media file is opened (default 8, clamped 2–16).
      - CDN_FIRST_READ_MB=${CDN_FIRST_READ_MB:-}
      # Log verbosity (default: info). Scope to this crate to avoid dependency noise; takes
      # effect when the container is recreated. e.g. debridmoviemapper=debug, or
      # debridmoviemapper::acquire=debug,info
      - RUST_LOG=${RUST_LOG:-info}

      # ── Jellyfin notifications (all three required to enable) ──────────────────
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - JELLYFIN_RCLONE_MOUNT_PATH=/media

      # ── Acquisition engine ────────────────────────────────────────────────────
      # Tunes how releases are scraped, scored and verified for content the service
      # acquires (driven by Trakt sync below). An empty value = the documented default.
      # (Note: ACQUIRE_DEAD_TIMEOUT_SECS / DEDUP_REMOVE_DUPLICATES / REMOVE_FINISHED_SHOWS
      # below are SP3/Trakt-lifecycle knobs, grouped here for convenience.)
      # Override the scraper addon; default auto-templates Torrentio from the provider token.
      - SCRAPER_ADDON_URL=${SCRAPER_ADDON_URL:-}
      # Route the SCRAPER's traffic (Torrentio/addon) through an HTTP(S) proxy, e.g.
      # http://[user:pass@]host:port. Applies only to the scraper — not the CDN/TMDB/provider.
      - SCRAPER_PROXY_URL=${SCRAPER_PROXY_URL:-}
      # Hard resolution ceiling: 720 | 1080 | 2160/4k (default 1080).
      - MAX_RESOLUTION=${MAX_RESOLUTION:-}
      # Required audio language: 2- or 3-letter ISO code, or "original" = the title's original or spoken languages (default original).
      - AUDIO_LANGUAGE=${AUDIO_LANGUAGE:-}
      # Required subtitle language: 2- or 3-letter ISO code, or "none" = skip the subtitle check (default none).
      - SUBTITLE_LANGUAGE=${SUBTITLE_LANGUAGE:-}
      # Prefer HEVC/x265 (default true) / HDR (default false).
      - PREFER_HEVC=${PREFER_HEVC:-}
      - PREFER_HDR=${PREFER_HDR:-}
      # No-progress timeout (secs) before a Pending acquire is retried (default 1800, min 60).
      - STALL_TIMEOUT_SECS=${STALL_TIMEOUT_SECS:-}
      # Top-ranked candidates one pass tries to add, the next only when an add fails (default 5, min 1).
      - MAX_ACQUIRE_ATTEMPTS=${MAX_ACQUIRE_ATTEMPTS:-}
      # Secs an optimistic add may stay unresolved before it is reaped (default 600, min 120).
      - ACQUIRE_DEAD_TIMEOUT_SECS=${ACQUIRE_DEAD_TIMEOUT_SECS:-}
      # Min spacing (ms) between scraper requests (default 1000, clamped 100–60000; backs off on 429).
      - SCRAPER_MIN_INTERVAL_MS=${SCRAPER_MIN_INTERVAL_MS:-}
      # true = actually delete redundant duplicate torrents (default false: dry-run, log only).
      - DEDUP_REMOVE_DUPLICATES=${DEDUP_REMOVE_DUPLICATES:-}
      # true = auto-remove fully-watched ended non-watchlisted shows (default false: preview, log only).
      - REMOVE_FINISHED_SHOWS=${REMOVE_FINISHED_SHOWS:-}

      # ── Trakt sync (SP2) ──────────────────────────────────────────────────────
      # Set BOTH id + secret (from a Trakt API app) to drive the library from users'
      # watchlists/history. Absent, nothing is acquired from watchlists or watch history, but the
      # account mirror, dedup and the upgrade engine still work on what is already in the account
      # (UPGRADE_INTERVAL_SECS=0 stops the upgrade engine replacing and deleting existing copies).
      # Then link accounts at the /trakt/accounts page on the published port.
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      # Sync + reconcile cadence (secs; default 900, min 60).
      - TRAKT_SYNC_INTERVAL_SECS=${TRAKT_SYNC_INTERVAL_SECS:-}
      # Episode-monitor cadence (secs; default 3600, min 300).
      - TRAKT_EPISODE_CHECK_INTERVAL_SECS=${TRAKT_EPISODE_CHECK_INTERVAL_SECS:-}
      # Catch-up: a show you've watched that Trakt reports as behind, last watched within this
      # window, gets every aired episode you haven't watched (including ones that aired before
      # your last watch). Window: a number of days, weeks, months (30 days) or years, e.g. 90d,
      # 12w, 6mo (or 6m / "6 months"), 1y; a bare number = days. unset/0 = all-time (default),
      # which can mean many torrents for a large watch history; an unrecognised value also means
      # all-time (with a warning in the log).
      - TRAKT_CATCHUP_LOOKBACK=${TRAKT_CATCHUP_LOOKBACK:-}
      # Extra host names (comma-separated, no scheme or port) the /trakt pages answer for, e.g. a
      # reverse proxy's FQDN. IP addresses, localhost, single-label names (debridmoviemapper) and
      # .local/.lan/.internal/.home.arpa names always work; any other Host is refused (guards
      # against DNS rebinding).
      - TRAKT_ENROL_ALLOWED_HOSTS=${TRAKT_ENROL_ALLOWED_HOSTS:-}

      # ── Upgrade engine (SP3) ──────────────────────────────────────────────────
      # Daily quality-upgrade + full-season consolidation. On by default; it adds better cached
      # releases and deletes the copies they replace, torrents you added yourself included. Put
      # UPGRADE_INTERVAL_SECS=0 in .env to disable it.
      # Pass cadence (secs; default 86400 = daily; 0 disables; min 600 when non-zero).
      - UPGRADE_INTERVAL_SECS=${UPGRADE_INTERVAL_SECS:-}
      # Cap on titles re-scored per pass (default: unset = the whole library; min 1).
      - UPGRADE_BUDGET_PER_TICK=${UPGRADE_BUDGET_PER_TICK:-}
      # Secs without a proxy read before a copy may be swapped, pruned or removed (default 300, min 30).
      - UPGRADE_IDLE_SECS=${UPGRADE_IDLE_SECS:-}
      # true = replace an owned copy above MAX_RESOLUTION with a within-ceiling cached release
      # (default false: preview, log only).
      - ALLOW_RESOLUTION_DOWNGRADE=${ALLOW_RESOLUTION_DOWNGRADE:-}
    volumes:
      - metadata:/data
    # Overrides Dockerfile HEALTHCHECK with faster intervals for depends_on startup ordering
    healthcheck:
      test: ["CMD", "/debridmoviemapper", "--healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    user: "65534:65534"
    depends_on:
      debridmoviemapper:
        condition: service_healthy
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./rclone:/data:rshared
    environment:
      - TZ=Europe/London
    command: >
      mount :webdav: /data
      --webdav-url http://debridmoviemapper:8080
      --webdav-vendor other
      --vfs-cache-mode off
      --allow-other
      --allow-non-empty
      --dir-cache-time 10s
      --poll-interval 15s
    healthcheck:
      test: ["CMD-SHELL", "grep -q fuse /proc/self/mountinfo"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "65534:65534"
    depends_on:
      rclone:
        condition: service_healthy
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./rclone:/media:ro
    # devices:
    #   - /dev/dri:/dev/dri  # Uncomment for hardware transcoding (requires GPU)

volumes:
  metadata: {}
  jellyfin-cache: {}
  jellyfin-config: {}
