# Keep dependencies patched. The GitHub Actions in ci.yml/release.yml are referenced by floating
# major-version tags (e.g. actions/checkout@v7); those jobs hold registry credentials
# (packages: write, and contents: write in release.yml), so a compromised upstream tag could
# exfiltrate them. Dependabot opens update PRs for the actions and the Cargo tree, so drift is
# caught rather than silently carried.
#
# Dependabot reads this file only from the default branch (main), so none of it runs, for any
# branch, until it is merged there. Without `target-branch` it opens PRs only against main; the `v2`
# entries cover the development line. Dependabot alerts (advisories) follow only main's Cargo.lock
# either way: .github/workflows/audit.yml is the RustSec advisory check for v2's.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"
